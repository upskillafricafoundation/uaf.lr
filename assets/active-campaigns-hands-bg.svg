<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a3342" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#141a24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070a10" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.88" />
    </radialGradient>

    <!-- Shading Gradients for Hands -->
    <linearGradient id="handLeftGlow" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#64748b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="handRightGlow" x1="100%" y1="20%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#cbd5e1" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#64748b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="fingerShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <filter id="deepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Deep Moody Base Canvas -->
  <rect width="1400" height="480" fill="url(#centerGlow)" />

  <!-- Textured Ambient Shadows & Creases -->
  <g opacity="0.35" filter="url(#softBlur)">
    <circle cx="700" cy="240" r="320" fill="#0f172a" />
    <path d="M 0 350 Q 400 300 700 380 T 1400 350 L 1400 480 L 0 480 Z" fill="#020617" />
    <path d="M 0 0 L 1400 0 L 1400 120 Q 900 160 500 100 T 0 140 Z" fill="#020617" />
  </g>

  <!-- Caring Clasping Hands (Stylized High-Contrast Monochrome Silhouettes) -->
  <g id="clasping-hands" filter="url(#deepShadow)">
    <!-- Left Forearm & Wrist -->
    <path d="M -50 360 C 150 340, 320 300, 480 270 C 530 260, 580 250, 620 250 C 580 290, 520 340, 420 380 C 280 430, 100 460, -50 470 Z" 
          fill="url(#handLeftGlow)" />

    <!-- Right Forearm & Cuff -->
    <path d="M 1450 340 C 1260 320, 1100 280, 930 250 C 880 240, 830 235, 780 235 C 820 280, 880 330, 990 380 C 1140 430, 1310 460, 1450 470 Z" 
          fill="url(#handRightGlow)" />

    <!-- Left Palm Base & Thumb Cradle -->
    <path d="M 480 270 C 520 240, 570 210, 630 190 C 670 180, 710 190, 730 220 C 720 250, 670 270, 620 275 C 570 280, 520 280, 480 270 Z" 
          fill="url(#handLeftGlow)" />

    <!-- Left Hand Fingers wrapping gently over right hand -->
    <!-- Index Finger -->
    <path d="M 620 190 C 680 180, 740 185, 790 205 C 810 215, 820 230, 805 242 C 785 255, 740 245, 680 230 C 640 220, 610 205, 620 190 Z" 
          fill="url(#fingerShade)" />
    
    <!-- Middle Finger (Long, strong, supportive) -->
    <path d="M 605 220 C 670 210, 750 215, 825 240 C 850 250, 855 268, 835 280 C 805 295, 740 280, 665 260 C 625 250, 595 235, 605 220 Z" 
          fill="url(#fingerShade)" />

    <!-- Ring Finger -->
    <path d="M 580 250 C 650 245, 730 255, 800 280 C 825 290, 830 305, 810 318 C 780 330, 720 315, 645 295 C 600 280, 570 265, 580 250 Z" 
          fill="url(#fingerShade)" />

    <!-- Pinky Finger -->
    <path d="M 550 280 C 620 275, 690 290, 755 315 C 775 325, 780 338, 760 348 C 735 358, 680 345, 615 325 C 575 310, 540 295, 550 280 Z" 
          fill="url(#fingerShade)" />

    <!-- Right Hand Clasping From Behind/Below (Supportive Interlocking Palm) -->
    <!-- Supporting Thumb -->
    <path d="M 850 230 C 800 210, 750 210, 700 225 C 670 235, 650 250, 660 262 C 675 272, 720 265, 770 255 C 810 245, 840 240, 850 230 Z" 
          fill="url(#handRightGlow)" />

    <!-- Right Supporting Palm Curve Underneath -->
    <path d="M 780 235 C 720 270, 660 310, 610 350 C 640 365, 690 360, 750 340 C 810 320, 870 280, 890 250 C 850 240, 810 235, 780 235 Z" 
          fill="url(#handRightGlow)" opacity="0.9" />

    <!-- Soft Finger Knuckle & Tendon Highlights for Organic Realism -->
    <path d="M 640 195 Q 675 190 710 200" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none" />
    <path d="M 630 225 Q 675 218 720 230" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" opacity="0.6" fill="none" />
    <path d="M 610 255 Q 655 250 700 265" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.5" fill="none" />
    <path d="M 580 285 Q 625 285 670 300" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round" opacity="0.4" fill="none" />

    <!-- Caring Contact Shadow between palms -->
    <path d="M 660 230 C 700 225, 740 230, 770 245 C 740 255, 700 255, 660 245 Z" fill="#000000" opacity="0.8" />
    <path d="M 630 260 C 680 255, 730 265, 765 285 C 730 295, 680 290, 630 275 Z" fill="#000000" opacity="0.75" />
  </g>

  <!-- Atmospheric Lighting & Dark Contrast Vignette (Guarantees White Text Pop) -->
  <rect width="1400" height="480" fill="url(#vignette)" />

  <!-- Subtle Film Grain / Dust Specks for Warm Authentic Feel -->
  <circle cx="280" cy="120" r="1.5" fill="#ffffff" opacity="0.15" />
  <circle cx="920" cy="90" r="1.2" fill="#ffffff" opacity="0.12" />
  <circle cx="450" cy="380" r="1" fill="#ffffff" opacity="0.1" />
  <circle cx="1180" cy="320" r="1.8" fill="#ffffff" opacity="0.15" />
  <circle cx="720" cy="60" r="1.2" fill="#ffffff" opacity="0.18" />
</svg>
